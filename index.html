<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <title>Flood-Safe-Road | Real-Time Chennai Hydrological Routing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

            background: #e0f2fe;

<style>

    .panel {

</style>

<body>
    <div id="map"></div>

    <script>
        const map = L.map('map').setView([13.0100, 80.2100], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const F = (name, severity, base_depth_cm, note, source, lng, lat) => ({
            type: "Feature",
            properties: { name, severity, base_depth_cm, depth_cm: base_depth_cm, rain_mm: 0, note, source },
            geometry: { type: "Point", coordinates: [lng, lat] }
        });

        const BASE_HOTSPOTS = [
            F("Velachery", "severe", 85, "Several areas marooned", "Deccan Herald, 4 Dec 2023", 80.2206, 12.9770),
            F("Pallikaranai", "severe", 90, "Cars floating in apartment parking; knee-deep water", "Deccan Herald, 4 Dec 2023", 80.2079, 12.9302),
            F("Mudichur", "severe", 110, "Residents rescued by boat", "Deccan Herald, 5 Dec 2023", 80.0703, 12.9143),
            F("Perungalathur", "severe", 100, "Residents rescued by boat", "Deccan Herald, 5 Dec 2023", 80.0884, 12.9144),
            F("Varadharajapuram", "severe", 105, "Residents rescued by boat", "Deccan Herald, 4 Dec 2023", 80.0677, 12.9050),
            F("Tambaram", "waterlogged", 25, "Inundation reported; people moving to safer zones", "PTI, 6 Dec 2023", 80.1143, 12.9231),
            F("Vadapalani", "waterlogged", 22, "Waterlogging seen on roads", "ANI, 4 Dec 2023", 80.2109, 13.0501),
            F("Arumbakkam", "waterlogged", 20, "Waterlogging seen on roads", "ANI, 4 Dec 2023", 80.2077, 13.0740),
            F("Madipakkam", "severe", 80, "Residents marooned; terraces only dry refuge", "DT Next, 6 Dec 2023", 80.1986, 12.9598),
            F("Sholinganallur", "severe", 75, "Listed among marooned areas on OMR", "DT Next, 6 Dec 2023", 80.2299, 12.8981),
            F("Perungudi", "severe", 70, "Heavily waterlogged; residents unable to leave", "Citizen Matters, Dec 2023", 80.2413, 12.9705),
            F("Thiruvanmiyur", "waterlogged", 35, "Waist-deep water reported around Kamaraj Nagar", "Adyar Times, 9 Dec 2023", 80.2641, 12.9853),
            F("Saidapet (Adyar Bank)", "severe", 95, "Adyar river overflow submerged low-lying streets", "The Hindu, 5 Dec 2023", 80.2209, 13.0213),
            F("Kotturpuram", "severe", 85, "Riverbank residential blocks inundated", "The Hindu, 5 Dec 2023", 80.2417, 13.0169),
            F("T. Nagar (Usman Rd)", "waterlogged", 28, "Subways closed; arterial road waterlogged", "Times of India, 4 Dec 2023", 80.2337, 13.0418),
            F("Ashok Nagar", "waterlogged", 24, "100 Feet Road & avenues flooded", "DT Next, 5 Dec 2023", 80.2121, 13.0373),
            F("Guindy Industrial Estate", "waterlogged", 30, "Knee-deep stagnation near Kathipara", "Indian Express, 4 Dec 2023", 80.2127, 13.0067),
            F("Porur Junction", "waterlogged", 22, "Lake surplus caused heavy road stagnation", "Deccan Herald, 5 Dec 2023", 80.1565, 13.0382),
            F("Kolathur", "severe", 75, "Retteri lake surplus flooded residential colonies", "The Hindu, 6 Dec 2023", 80.2120, 13.1240),
            F("Ennore / Manali", "severe", 90, "Kosasthalaiyar backwaters inundated roads", "Citizen Matters, Dec 2023", 80.2760, 13.1680)
        ];

        let floodFeatures = JSON.parse(JSON.stringify(BASE_HOTSPOTS));
        let isLiveMode = true;
        // 1. Initialize Supabase Client
        const SUPABASE_URL = 'https://evzzbqvgfpziwvcdsgzf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_yrQ2TBaXOzCeniFTo_krnw_lCZLs5Q4';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Load active community reports from Supabase (auto-expires anything older than 6 hours)
        async function loadCommunityReports() {
            try {
                const twelveHoursAgo = new Date(Date.now() - 12 * 60 * 60 * 1000).toISOString();
                const { data, error } = await sb
                    .from('reports')
                    .select('*')
                    .gte('created_at', twelveHoursAgo);


                if (error) throw error;

                // Remove old community pins before merging fresh ones from DB
                floodFeatures = floodFeatures.filter(f => f.properties.source !== 'Community Report');

                (data || new Array()).forEach(row => {
                    // TRUST RULE: Red ('severe') ONLY if depth >= 50cm AND confirmations >= 2
                    const isVerifiedSevere = row.depth_cm >= 50 && row.confirmations >= 2;
                    const severity = isVerifiedSevere ? 'severe' : 'waterlogged';

                    const feat = F(
                        `Community Report: ${row.category} (${row.confirmations} confirm${row.confirmations > 1 ? 's' : ''})`,
                        severity,
                        row.depth_cm,
                        row.elev_text || 'Reported by community member',
                        'Community Report',
                        row.lng,
                        row.lat
                    );
                    feat.properties.dbId = row.id;
                    feat.properties.confirmations = row.confirmations;
                    floodFeatures.push(feat);
                });

                renderFloodZones();
                if (startPoint && endPoint) computeRoute();
            } catch (err) {
                console.warn('Supabase load skipped/offline:', err.message);
            }
        }

        // 3. Increment confirmation count in Supabase when a user clicks "Confirm"
        window.confirmFloodReport = async function (dbId, currentCount) {
            try {
                const newCount = (currentCount || 1) + 1;
                const { error } = await sb
                    .from('reports')
                    .update({ confirmations: newCount })
                    .eq('id', dbId);

                if (error) throw error;
                map.closePopup();
                await loadCommunityReports();
            } catch (err) {
                alert('Could not confirm report: ' + err.message);
            }
        };


        const colors = { severe: '#dc2626', waterlogged: '#f59e0b', clear: '#10b981' };
        const FLOOD_RADIUS = { severe: 550, waterlogged: 350, clear: 200 };

        const MODES = {
            walk: { label: 'Walk', costing: 'pedestrian', maxDepthCm: 12, speedKmh: 5 },
            bike: { label: 'Bike / 2W', costing: 'bicycle', maxDepthCm: 18, speedKmh: 22 },
            car: { label: 'Car', costing: 'auto', maxDepthCm: 32, speedKmh: 30 },
            suv: { label: 'Rescue SUV', costing: 'auto', maxDepthCm: 65, speedKmh: 35 }
        };

        let currentMode = 'bike';
        let startPoint = null, endPoint = null;
        let startMarker = null, endMarker = null;
        let normalLayer = null, safeLayer = null;
        const floodLayerGroup = L.layerGroup().addTo(map);

        function renderFloodZones() {
            floodLayerGroup.clearLayers();
            floodFeatures.forEach(f => {
                const p = f.properties;
                const latlng = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
                const color = colors[p.severity];
                const sensor = p.source === 'Community Report' ? 'Community Report'
                    : isLiveMode ? `Open-Meteo rainfall (${p.rain_mm.toFixed(1)} mm / 12h)`
                        : 'News report, Dec 2023';

                const isCommunity = p.source === 'Community Report';
                const trustBadge = isCommunity
                    ? (p.confirmations >= 2
                        ? `<div style="color:#dc2626;font-weight:700;margin-top:4px;">✅ Verified Hazard (${p.confirmations} confirmations)</div>`
                        : `<div style="color:#d97706;font-weight:700;margin-top:4px;">⏳ Unverified (${p.confirmations}/2 confirmations — stays amber until 2nd user confirms)</div>`)
                    : '';

                const confirmBtnHtml = (isCommunity && p.dbId)
                    ? `<div style="display:flex;gap:4px;margin-top:6px;">
                        <button class="action-btn" style="margin-top:0;background:#0284c7;flex:1;" onclick="confirmFloodReport(${p.dbId}, ${p.confirmations})">👍 Confirm (${p.confirmations})</button>
                        <button class="action-btn" style="margin-top:0;background:#64748b;flex:1;" onclick="reportFalseFlood(${p.dbId}, ${p.confirmations})">❌ False / Clear</button>
                        </div>`
                    : '';

                L.circleMarker(latlng, {
                    radius: 8,
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.75
                }).bindPopup(
                    `<b>${p.name}</b><br>` +
                    `<b>Water Depth:</b> ${p.depth_cm} cm (${p.severity.toUpperCase()})<br>` +
                    `${p.note}<br>` +
                    `<span class="badge">${sensor}</span>` +
                    trustBadge +
                    confirmBtnHtml +
                    `<br><small>${p.source}</small>`
                ).addTo(floodLayerGroup);

                if (p.severity !== 'clear') {
                    L.circle(latlng, {
                        radius: FLOOD_RADIUS[p.severity],
                        color: color, weight: 1, dashArray: '4', fillOpacity: 0.08, interactive: false
                    }).addTo(floodLayerGroup);
                }
            });
        }


        async function syncLiveWeather() {
            isLiveMode = true;
            const statusEl = document.getElementById('weatherStatus');
            if (statusEl) statusEl.innerHTML = '⏳ Fetching 12h live Chennai rainfall...';

            try {
                const lats = BASE_HOTSPOTS.map(f => f.geometry.coordinates.at(1)).join(',');
                const lngs = BASE_HOTSPOTS.map(f => f.geometry.coordinates.at(0)).join(',');

                const apiUrl = new URL('https://open-meteo.com');
                apiUrl.hostname = '://open-meteo.com';
                apiUrl.pathname = '/v1/forecast';
                apiUrl.searchParams.set('latitude', lats);
                apiUrl.searchParams.set('longitude', lngs);
                apiUrl.searchParams.set('hourly', 'precipitation');
                apiUrl.searchParams.set('past_hours', '12');
                apiUrl.searchParams.set('forecast_hours', '1');

                const res = await fetch(apiUrl.toString());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();

                const communityPins = floodFeatures.filter(f => f.properties.source === 'Community Report');

                const updated = BASE_HOTSPOTS.map((spot, idx) => {
                    const clone = JSON.parse(JSON.stringify(spot));
                    const locWeather = Array.isArray(data) ? data.at(idx) : data;
                    const hourlyRain = (locWeather && locWeather.hourly && locWeather.hourly.precipitation)
                        ? locWeather.hourly.precipitation.slice(0, 12)
                        : new Array();

                    // Calculate total 12h rain AND retained standing water (12% hourly drainage decay)
                    const totalRain12h = hourlyRain.reduce((sum, val) => sum + (val || 0), 0);
                    const effectiveRetainedRain = hourlyRain.reduce((sum, val, hourIdx) => {
                        const hoursAgo = (hourlyRain.length - 1) - hourIdx;
                        const drainageFactor = Math.pow(0.88, Math.max(0, hoursAgo));
                        return sum + ((val || 0) * drainageFactor);
                    }, 0);

                    const vulnerability = clone.properties.base_depth_cm / 50;
                    const estimatedDepth = Math.round(effectiveRetainedRain * 1.6 * vulnerability);

                    clone.properties.rain_mm = totalRain12h;
                    clone.properties.depth_cm = estimatedDepth;
                    clone.properties.severity = estimatedDepth >= 50 ? 'severe' : estimatedDepth >= 15 ? 'waterlogged' : 'clear';
                    clone.properties.note = totalRain12h > 0
                        ? `12h rainfall: ${totalRain12h.toFixed(1)} mm (retained runoff modeled)`
                        : 'No significant rainfall in last 12 hrs';
                    clone.properties.source = 'Open-Meteo 12h Hydrological Model';
                    return clone;
                });

                floodFeatures = updated.concat(communityPins);
                renderFloodZones();

                const activeCount = floodFeatures.filter(f => f.properties.severity !== 'clear').length;
                if (statusEl) {
                    statusEl.innerHTML = `🟢 <b>LIVE MODE (12h):</b> ${activeCount} active waterlogged zones right now.`;
                }
                if (startPoint && endPoint) computeRoute();
            } catch (e) {
                console.error('Weather sync failed:', e);
                if (statusEl) statusEl.innerHTML = '⚠️ Live weather error: ' + e.message;
            }
        }



        function load2023Simulation() {
            const userPins = floodFeatures.filter(f => f.properties.source === 'User Report');
            floodFeatures = [...JSON.parse(JSON.stringify(BASE_HOTSPOTS)), ...userPins];
            renderFloodZones();
            const statusEl = document.getElementById('weatherStatus');
            if (statusEl) statusEl.innerHTML = '🟠 <b>SIMULATION:</b> Dec 2023 Cyclone (20 active zones)';
            if (startPoint && endPoint) computeRoute();
        }

        map.on('click', e => {
            if (startPoint && endPoint) resetRoute();
            if (!startPoint) {
                startPoint = e.latlng;
                startMarker = L.marker(e.latlng).addTo(map).bindPopup("Start").openPopup();
            } else {
                endPoint = e.latlng;
                endMarker = L.marker(e.latlng).addTo(map).bindPopup("Finding safe route...").openPopup();
                computeRoute();
            }
        });

        // Community Report with 4 Depth Categories, Elevation Cross-Check & Auto-Expiry
        map.on('contextmenu', async e => {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            // Fetch real ground elevation (DEM) from Open-Meteo Elevation API
            let elevText = 'Checking elevation...';
            try {
                const elevUrl = new URL('https://open-meteo.com');
                elevUrl.hostname = '://open-meteo.com';
                elevUrl.pathname = '/v1/elevation';
                elevUrl.searchParams.set('latitude', String(lat));
                elevUrl.searchParams.set('longitude', String(lng));
                const res = await fetch(elevUrl.toString());
                const elevData = await res.json();
                const meters = elevData.elevation && elevData.elevation.at(0);
                if (meters !== undefined) {
                    const risk = meters <= 6 ? 'High (Low-lying)' : meters <= 12 ? 'Moderate' : 'Low (Elevated)';
                    elevText = `Elevation: ${meters.toFixed(1)}m ASL • Plausibility: ${risk}`;
                }
            } catch (err) {
                elevText = 'Elevation: DEM check offline';
            }

            // Show the 4 Depth Categories promised in your TYSIC proposal
            const pickerHtml = `
    <div style="font-size:12px;min-width:190px;">
      <b>📢 Report Flood Depth</b><br>
      <small style="color:#0369a1;">${elevText}</small><br>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px;">
        <button class="mode-btn" onclick="submitCommunityReport(${lat}, ${lng}, 'Ankle', 15, '${elevText}')">🦶 Ankle (~15cm)</button>
        <button class="mode-btn" onclick="submitCommunityReport(${lat}, ${lng}, 'Knee', 45, '${elevText}')">🦵 Knee (~45cm)</button>
        <button class="mode-btn" onclick="submitCommunityReport(${lat}, ${lng}, 'Half wheel', 65, '${elevText}')">🛞 Half wheel (~65cm)</button>
        <button class="mode-btn" onclick="submitCommunityReport(${lat}, ${lng}, 'Above wheel', 95, '${elevText}')">🌊 Above wheel (~95cm)</button>
      </div>
    </div>
  `;

            L.popup().setLatLng(e.latlng).setContent(pickerHtml).openOn(map);
        });

        window.submitCommunityReport = async function (lat, lng, category, depthCm, elevText) {
            map.closePopup();
            try {
                const { error } = await sb.from('reports').insert(Array.of({
                    lat: lat,
                    lng: lng,
                    category: category,
                    depth_cm: depthCm,
                    elev_text: elevText,
                    confirmations: 1
                }));
                if (error) throw error;
                await loadCommunityReports();
            } catch (err) {
                alert('Failed to save report to Supabase: ' + err.message);
            }
        };
        window.reportFalseFlood = async function (dbId, currentCount) {
            try {
                const newCount = (currentCount || 1) - 1;
                if (newCount <= 0) {
                    // Remove false/cleared report completely from Supabase
                    const { error } = await sb.from('reports').delete().eq('id', dbId);
                    if (error) throw error;
                } else {
                    // Lower confirmation count if another user still confirmed it
                    const { error } = await sb
                        .from('reports')
                        .update({ confirmations: newCount })
                        .eq('id', dbId);
                    if (error) throw error;
                }
                map.closePopup();
                await loadCommunityReports();
            } catch (err) {
                alert('Could not update report: ' + err.message);
            }
        };



        // Auto-expire old community reports every minute so receding water never blocks roads
        setInterval(() => {
            const now = Date.now();
            const before = floodFeatures.length;
            floodFeatures = floodFeatures.filter(f => !f.properties.expiresAt || f.properties.expiresAt > now);
            if (floodFeatures.length !== before) {
                renderFloodZones();
                if (startPoint && endPoint) computeRoute();
            }
        }, 60000);


        function resetRoute() {
            [startMarker, endMarker, normalLayer, safeLayer].forEach(l => l && map.removeLayer(l));
            startPoint = endPoint = startMarker = endMarker = normalLayer = safeLayer = null;
            document.getElementById('directionsDrawer').style.display = 'none';
            activeRoutePath = new Array();
        }

        function showInfo(html) {
            if (endMarker) endMarker.setPopupContent(html).openPopup();
        }

        function getBlockedZones(path) {
            const limit = MODES[currentMode].maxDepthCm;
            return floodFeatures.filter(f => {
                if (f.properties.depth_cm <= limit || f.properties.severity === 'clear') return false;
                const spot = L.latLng(f.geometry.coordinates.at(1), f.geometry.coordinates.at(0));
                const r = FLOOD_RADIUS[f.properties.severity];
                return path.some(pt => map.distance(L.latLng(pt), spot) < r);
            });
        }

        function createCirclePolygon(lng, lat, radiusMeters, points = 12) {
            const coords = [];
            const dLat = (radiusMeters / 6378137) * (180 / Math.PI);
            const dLng = dLat / Math.cos((lat * Math.PI) / 180);
            for (let i = 0; i < points; i++) {
                const theta = (i / points) * (2 * Math.PI);
                coords.push(Array.of(
                    +(lng + dLng * Math.cos(theta)).toFixed(5),
                    +(lat + dLat * Math.sin(theta)).toFixed(5)
                ));
            }
            // Close the polygon ring (first point === last point) as required by Valhalla
            coords.push(coords.at(0));
            return coords;
        }

        function decodePolyline(str, precision = 6) {
            let index = 0, lat = 0, lng = 0, coordinates = [], factor = Math.pow(10, precision);
            while (index < str.length) {
                let byte = null, shift = 0, result = 0;
                do {
                    byte = str.charCodeAt(index++) - 63;
                    result |= (byte & 0x1f) << shift;
                    shift += 5;
                } while (byte >= 0x20);
                lat += ((result & 1) ? ~(result >> 1) : (result >> 1));

                shift = 0;
                result = 0;
                do {
                    byte = str.charCodeAt(index++) - 63;
                    result |= (byte & 0x1f) << shift;
                    shift += 5;
                } while (byte >= 0x20);
                lng += ((result & 1) ? ~(result >> 1) : (result >> 1));

                coordinates.push([lat / factor, lng / factor]);
            }
            return coordinates;
        }

        async function fetchValhalla(start, end, mode, excludePolygons = new Array()) {
            const payload = {
                locations: Array.of(
                    { lat: start.lat, lon: start.lng },
                    { lat: end.lat, lon: end.lng }
                ),
                costing: mode.costing,
                exclude_polygons: excludePolygons,
                directions_options: { units: 'kilometers' }
            };

            const valhallaUrl = new URL('https://openstreetmap.de');
            valhallaUrl.hostname = 'valhalla1.openstreetmap.de';
            valhallaUrl.pathname = '/route';

            const res = await fetch(valhallaUrl.toString(), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (!res.ok || !data.trip) {
                console.error('Valhalla response error:', data);
                throw new Error(data.error || 'Valhalla routing failed');
            }

            return {
                path: decodePolyline(data.trip.legs.at(0).shape, 6),
                km: data.trip.summary.length
            };
        }


        async function computeRoute() {
            if (!startPoint || !endPoint) return;
            if (normalLayer) map.removeLayer(normalLayer);
            if (safeLayer) map.removeLayer(safeLayer);
            const mode = MODES[currentMode];

            try {
                const direct = await fetchValhalla(startPoint, endPoint, mode, new Array());
                const blocked = getBlockedZones(direct.path);

                // 1. GREEN: Direct route is already 100% clear
                if (blocked.length === 0) {
                    renderDirections(direct.maneuvers, 'Turn-by-Turn (Direct)');
                    normalLayer = L.polyline(direct.path, { color: '#16a34a', weight: 5 }).addTo(map);
                    activeRoutePath = direct.path;
                    map.fitBounds(normalLayer.getBounds(), { padding: L.point(40, 40) });
                    const mins = Math.round((direct.km / mode.speedKmh) * 60);
                    showInfo(
                        `<b>🟢 Complete Safe ${mode.label} Route</b><br>` +
                        `${direct.km.toFixed(1)} km (~${mins} min)<br>` +
                        `<small>All water levels ≤ ${mode.maxDepthCm} cm limit.</small>`
                    );
                    return;
                }

                const toPolygon = f => createCirclePolygon(
                    f.geometry.coordinates.at(0),
                    f.geometry.coordinates.at(1),
                    Math.min(FLOOD_RADIUS[f.properties.severity], 200),
                    8
                );

                const isSafeFromPins = f => {
                    const center = L.latLng(f.geometry.coordinates.at(1), f.geometry.coordinates.at(0));
                    const r = Math.min(FLOOD_RADIUS[f.properties.severity], 200);
                    return map.distance(center, startPoint) > r && map.distance(center, endPoint) > r;
                };

                let avoidedSet = blocked.filter(isSafeFromPins);

                // 2. ORANGE: Start or Destination is inside a flood zone (unavoidable)
                if (avoidedSet.length === 0) {
                    renderDirections(direct.maneuvers, 'Turn-by-Turn (Caution)');
                    normalLayer = L.polyline(direct.path, { color: '#f97316', weight: 5 }).addTo(map);
                    activeRoutePath = direct.path;
                    map.fitBounds(normalLayer.getBounds(), { padding: L.point(40, 40) });
                    const mins = Math.round((direct.km / mode.speedKmh) * 60);
                    const pinZones = blocked.map(b => `${b.properties.name} (${b.properties.depth_cm}cm)`).join(', ');
                    showInfo(
                        `<b>🟠 Partial Risk Route (${mode.label})</b><br>` +
                        `${direct.km.toFixed(1)} km (~${mins} min)<br>` +
                        `<small>⚠️ Cannot avoid start/end flood zone: ${pinZones}</small>`
                    );
                    return;
                }

                // 3. RED DASHED: Direct route is flooded / unsafe
                normalLayer = L.polyline(direct.path, { color: '#dc2626', weight: 4, dashArray: '8 8' }).addTo(map);

                // Pass 1 & 2: Compute detour around external flood zones
                let safeRoute = await fetchValhalla(startPoint, endPoint, mode, avoidedSet.map(toPolygon));
                const secondaryHits = getBlockedZones(safeRoute.path).filter(
                    f => !avoidedSet.includes(f) && isSafeFromPins(f)
                );
                if (secondaryHits.length > 0 && (avoidedSet.length + secondaryHits.length) <= 7) {
                    avoidedSet = avoidedSet.concat(secondaryHits);
                    safeRoute = await fetchValhalla(startPoint, endPoint, mode, avoidedSet.map(toPolygon));
                }

                // Check if any flood zone STILL remains on the detour (e.g., around start/end pin)
                const remainingFloods = getBlockedZones(safeRoute.path);
                const isCompletelySafe = remainingFloods.length === 0;
                const detourColor = isCompletelySafe ? '#16a34a' : '#f97316'; // Green if 100% clear, Orange if partial

                safeLayer = L.polyline(safeRoute.path, { color: detourColor, weight: 5 }).addTo(map);
                activeRoutePath = safeRoute.path;
                map.fitBounds(L.featureGroup(Array.of(normalLayer, safeLayer)).getBounds(), { padding: L.point(40, 40) });

                const mins = Math.round((safeRoute.km / mode.speedKmh) * 60);
                const avoidedNames = avoidedSet.map(b => `${b.properties.name} (${b.properties.depth_cm}cm)`).join(', ');
                const remainingNames = remainingFloods.map(b => `${b.properties.name} (${b.properties.depth_cm}cm)`).join(', ');

                if (isCompletelySafe) {
                    showInfo(
                        `<b>🟢 Complete Safe ${mode.label} Detour</b><br>` +
                        `<span style="color:#16a34a"><b>Safe:</b> ${safeRoute.km.toFixed(1)} km (~${mins} min)</span> | ` +
                        `<span style="color:#dc2626">Flooded: ${direct.km.toFixed(1)} km</span><br>` +
                        `<small><b>Avoided:</b> ${avoidedNames}</small>`
                    );
                } else {
                    showInfo(
                        `<b>🟠 Partial Safe ${mode.label} Detour</b><br>` +
                        `<span style="color:#f97316"><b>Detour:</b> ${safeRoute.km.toFixed(1)} km (~${mins} min)</span> | ` +
                        `<span style="color:#dc2626">Flooded: ${direct.km.toFixed(1)} km</span><br>` +
                        `<small><b>Avoided:</b> ${avoidedNames}<br>` +
                        `⚠️ <b>Still crosses:</b> ${remainingNames}</small>`
                    );
                    renderDirections(safeRoute.maneuvers, 'Turn-by-Turn Safe Detour');
                }
            } catch (err) {
                console.error('Routing error:', err);
                showInfo(`<b>Detour Error:</b> ${err.message}`);
            }
        }

        // Fetch ALL real hospitals within 5km from OpenStreetMap Overpass API
        async function fetchNearbyHospitals(lat, lng, radiusMeters = 3000) {
            const keywords = Array.of('hospital', 'medical', 'clinic');
            const origin = L.latLng(lat, lng);

            const requests = keywords.map(async kw => {
                const photonUrl = new URL('https://komoot.io');
                photonUrl.hostname = 'photon.komoot.io';
                photonUrl.pathname = '/api/';
                photonUrl.searchParams.set('q', kw);
                photonUrl.searchParams.set('osm_tag', 'amenity:hospital');
                photonUrl.searchParams.set('lat', String(lat));
                photonUrl.searchParams.set('lon', String(lng));
                photonUrl.searchParams.set('limit', '15');

                const res = await fetch(photonUrl.toString());
                if (!res.ok) return new Array();
                const data = await res.json();
                return data.features || new Array();
            });

            const results = await Promise.all(requests);
            const allFeatures = results.flat();
            const seen = new Set();

            return allFeatures
                .map(feat => {
                    const hLat = feat.geometry.coordinates.at(1);
                    const hLng = feat.geometry.coordinates.at(0);
                    const props = feat.properties || {};
                    const name = props.name;
                    if (!hLat || !hLng || !name || props.osm_key === 'highway') return null;

                    const key = `${name}-${hLat.toFixed(4)}`;
                    if (seen.has(key)) return null;
                    seen.add(key);

                    if (map.distance(origin, L.latLng(hLat, hLng)) > radiusMeters) return null;
                    return { name: name, lat: hLat, lng: hLng };
                })
                .filter(Boolean);
        }




        async function routeToNearestSafeHospital(userLatLng) {
            const btn = document.getElementById('hospitalBtn');
            if (btn) btn.textContent = '⏳ Scanning nearby hospitals...';

            let hospitalList = FALLBACK_HOSPITALS;
            try {
                const liveHospitals = await fetchNearbyHospitals(userLatLng.lat, userLatLng.lng, 5000);
                if (liveHospitals.length > 0) {
                    hospitalList = liveHospitals;
                }
            } catch (e) {
                console.warn('Using fallback hospital list:', e);
            }

            if (btn) btn.textContent = '🚨 Nearest Safe Hospital';

            const limit = MODES[currentMode].maxDepthCm;

            // Filter out hospitals sitting inside an active flood zone deeper than vehicle limit
            const dryHospitals = hospitalList.filter(hosp => {
                const hPt = L.latLng(hosp.lat, hosp.lng);
                return !floodFeatures.some(f => {
                    if (f.properties.depth_cm <= limit || f.properties.severity === 'clear') return false;
                    const spot = L.latLng(f.geometry.coordinates.at(1), f.geometry.coordinates.at(0));
                    return map.distance(hPt, spot) < FLOOD_RADIUS[f.properties.severity];
                });
            });

            const candidates = dryHospitals.length > 0 ? dryHospitals : hospitalList;
            candidates.sort((a, b) =>
                map.distance(userLatLng, L.latLng(a.lat, a.lng)) - map.distance(userLatLng, L.latLng(b.lat, b.lng))
            );

            const nearest = candidates.at(0);
            resetRoute();
            startPoint = userLatLng;
            endPoint = L.latLng(nearest.lat, nearest.lng);

            document.getElementById('fromInput').value = 'My Current Location';
            document.getElementById('toInput').value = nearest.name;

            startMarker = L.marker(startPoint).addTo(map).bindPopup('📍 Start: Your Location');
            endMarker = L.marker(endPoint).addTo(map).bindPopup('🏥 ' + nearest.name).openPopup();
            computeRoute();
        }

            stopNavigation();
            const simBtn = document.getElementById('simNavBtn');
            simBtn.textContent = '⏹ Stop Simulation';

            let stepIdx = 0;
            // Move smoothly along the route coordinates every 250ms
            simTimer = setInterval(() => {
                if (stepIdx >= activeRoutePath.length) {
                    updateNavMarker(activeRoutePath.at(activeRoutePath.length - 1), '🏁 Arrived at Safe Destination!');
                    navMarker.openPopup();
                    clearInterval(simTimer);
                    simTimer = null;
                    simBtn.textContent = '▶️ Simulate Drive';
                    return;
                }

                const pt = activeRoutePath.at(stepIdx);
                const pct = Math.round((stepIdx / activeRoutePath.length) * 100);
                updateNavMarker(pt, `🧭 Navigating Safe Route (${pct}%)`);
                stepIdx += 1;
            }, 250);
        });

        // 2. Real-time device GPS tracking (updates continuously as you move in the real world)
        document.getElementById('liveGpsBtn').addEventListener('click', () => {
            if (gpsWatchId !== null) {
                stopNavigation();
                return;
            }
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser.');
                return;
            }

            stopNavigation();
            const gpsBtn = document.getElementById('liveGpsBtn');
            gpsBtn.textContent = '⏹ Stop GPS';

            gpsWatchId = navigator.geolocation.watchPosition(
                pos => {
                    const currentLatLng = L.latLng(pos.coords.latitude, pos.coords.longitude);
                    updateNavMarker(currentLatLng, '📡 Live GPS Position');

                    // If user is navigating an active route, dynamically update Start & re-route if needed
                    if (endPoint) {
                        startPoint = currentLatLng;
                        if (startMarker) startMarker.setLatLng(currentLatLng);
                    }
                },
                err => {
                    alert('GPS unavailable: ' + err.message);
                    stopNavigation();
                },
                { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
            );
        });
        document.getElementById('clearBtn').addEventListener('click', () => {
            stopNavigation(); resetRoute();
            document.getElementById('fromInput').value = '';
            document.getElementById('toInput').value = '';
        });


        syncLiveWeather();
        loadCommunityReports();

    </script>
</body>

</html>
